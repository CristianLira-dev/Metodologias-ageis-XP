<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metodologias Ágeis</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

<!-- Modal de Tentativas Esgotadas -->
<div id="modal-esgotado" class="modal d-none">
    <div class="modal-conteudo">
        <div class="text">
            <h2>Tentativas Esgotadas!</h2>
            
            <p>
                Você errou duas vezes nesta questão.
            </p>
        </div>

        <button id="btn-modal-esgotado" type="button">
            Próxima pergunta
        </button>
    </div>
</div>

<!-- Tela inicial do quiz -->
<div id="tela-boas-vindas">
    <main class="boas-vindas-conteudo">

        <!-- Título principal -->
        <h1 class="boas-vindas-titulo">
            Metodologias Ágeis
        </h1>

        <!-- Texto de apresentação -->
        <p class="boas-vindas-descricao">
            Teste seus conhecimentos sobre a metodologia ágil
            <h3 class="boas-vindas-xp">Extreme Programming (XP)</h3>
            respondendo às 4 perguntas do desafio.
        </p>

        <!-- Informações rápidas -->
        <div class="boas-vindas-informacoes">

            <div class="informacao">
                <strong>4</strong>
                <span>Perguntas</span>
            </div>

            <div class="divisor"></div>

            <div class="informacao">
                <strong>2</strong>
                <span>Tentativas</span>
            </div>

            <div class="divisor"></div>

            <div class="informacao">
                <span class="fatec">ADS</span>
            </div>

        </div>

        <!-- Botão que inicia a tentativa pelo JavaScript -->
        <button id="btn-iniciar-quiz" class="btn-iniciar-quiz">
            Iniciar Quiz
        </button>

        <p class="boas-vindas-aviso">
            Prepare-se e boa sorte!
        </p>

    </main>

</div>


<div id="tela-pergunta" class="d-none">
        <main class="content">
        <div class="card-question">
            <span class="badge">?</span>
            <h3 class="text-question" id="text-question"></h3>
        </div>

        <!--os botões serão inseridos pelo js -->
        <div id="container-alternativas"></div>

    </main>
</div>
<div id="tela-sucesso" style="display: none;">
    
</div>


    <script src="./js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    </body>

</html>
