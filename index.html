<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metodologias Ágeis</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

    <!-- Modal de Tentativas Esgotadas -->
<dialog id="modal-esgotado">
  <div class="modal-conteudo">
    <h2>Tentativas Esgotadas!</h2>
    <p>Você errou duas vezes nesta questão. Passando para a próxima pergunta...</p>
    
    <!-- Formulário nativo que fecha o dialog sem precisar de JS extra -->
    <form method="dialog">
      <button type="submit">Entendido</button>
    </form>
  </div>
</dialog>

<div id="tela-pergunta">
        <main class="content">
        <div class="card-question">
            <span class="badge">?</span>
            <h3 class="text-question" id="text-question"></h3>
        </div>

        <!--os botões serão inseridos pelo js -->
        <div id="container-alternativas"></div>

    </main>
</div>
<div id="tela-sucesso" style="display: none;">

</div>


    <script src="./js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
</body>

</html>
